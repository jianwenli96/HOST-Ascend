defaults:
  - self_grounded_predictor_joint_cross_attn_ve
  - _self_

# Read the provided Wan2.2 snapshot in place.  redirect_common_files=false
# keeps the VAE on this same read-only snapshot and prevents a converted-VAE
# download.  The same snapshot supplies the tokenizer/text encoder used by
# precomputation and open-loop evaluation.
model_id: /mi/data2T/Embodied-AI/ckpts/Wan-AI/Wan2.2-TI2V-5B
tokenizer_model_id: ${model.model_id}
redirect_common_files: false
action_dit_pretrained_path: checkpoints/ActionDiT_linear_interp_Wan22_alphascale_1024hdim.pt

# --- Trainable visual encoder (DINO+SigLIP fused first-frame conditioning) ---
visual_encoder:
  backbone_local_repo: null
  backbone_weights_path: null
  siglip_local_weights_path: null

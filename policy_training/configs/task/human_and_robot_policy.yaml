# @package _global_

defaults:
  - override /data: human_and_robot
  - override /model: self_grounded_predictor_joint_human_and_robot
  - _self_

batch_size: 1
num_workers: 4

learning_rate: 1e-5
min_lr_ratio: 0.1
num_epochs: 10
# Twenty source pairs are intended for adaptation, not a 1.5M-step run.
# Start conservatively and select the final duration from held-out validation.
max_steps: 10000
save_every: 500
eval_every: 200

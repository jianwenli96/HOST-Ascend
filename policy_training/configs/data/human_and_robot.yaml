train:
  _target_: self_grounded_prediction.datasets.custom.mydatasets.build_custom_dataset

  # Data source
  data_path: /efs-gy1/Embodied-AI/datasets/ICL-TTT/HumanAndRobot/align_data/splits/train/HumanAndRobot_video_paths.json
  exclude_episode_json: null

  # Frame sampling
  frames: 2                         # T=2 (lagged mode: start + end keyframe)
  action_frames: 15                 # default action interval per keyframe step
  random_frame_sampling: true
  raw_image: true

  # Action
  actions: true
  joints: true
  use_6d_rotation: true             # Euler -> 6D rotation (action_dim=20 for dual-arm)
  use_relative_action: false
  skip_no_action: true

  # Static frame removal
  remove_static_frames: true
  static_rot_threshold: 0.001        # radians
  static_trans_threshold: 0.001      # metres
  static_gripper_threshold: 0.001

  # Indicator (not yet supported in SelfGroundedPredictor)
  use_indicator_prompt: false
  use_indicator_positive: false

  # View selection
  num_view_probs: '{"1": 1.0}'     # 1-view only
  cam_mapping_dir: /efs-gy1/Embodied-AI/datasets/ICL-TTT/HumanAndRobot/align_data/cam_mapping
  joint_action_mapping_dir: /efs-gy1/Embodied-AI/datasets/ICL-TTT/HumanAndRobot/align_data/joint_action_mapping

  # Per-dataset target image size [H, W] — direct resize, no smart_resize
  dataset_image_size:
    HumanAndRobot: [224, 224]

  # Drop probabilities (batch-level, synced to model side)
  task_video_drop_prob: 0.5        # prob to drop task video for entire batch
  task_text_drop_prob: 0          # prob to drop text prompt for entire batch

  # Data augmentation
  use_augmentation: true
  datasets_weight: false            # uniform sampling

  # Placeholder for model config interpolation (not used by custom dataset)
  processor:
    action_output_dim: 12   # single-arm action dim (6D rotation: 3+6+1 = 10)
    proprio_output_dim: 14   # single-arm joint state dim

  # SelfGroundedPredictor video params
  action_video_freq_ratio: 6        # video downsample ratio
  max_action_len: 24                # must be divisible by (T_video-1); T_video=9 -> 8*4=24
  context_len: 512                  # T5 text embedding length

  # Task video peer selection file name
  task_paths_filename: "task_paths.json"

  # Sampling interval multipliers for random action frame spacing
  sampling_interval_min_mult: 0.5
  sampling_interval_max_mult: 2.0

  # Random sub-segment offset for task video frame-level shift
  task_video_random_offset: true

  # Task video max keyframes per num_views
  task_max_frames:
    1: [10, 10]

  # Per-dataset FPS (resamples raw episodes to uniform frame rate)
  dataset_fps:
    HumanAndRobot: 24

val:
  _target_: self_grounded_prediction.datasets.custom.mydatasets.build_custom_dataset

  # Data source — override at launch:  data.val.data_path=/path/to/val.json
  data_path: /efs-gy1/Embodied-AI/datasets/ICL-TTT/HumanAndRobot/align_data/splits/val/HumanAndRobot_video_paths.json
  exclude_episode_json: null

  # Frame sampling — deterministic for val
  frames: ${data.train.frames}
  action_frames: ${data.train.action_frames}
  random_frame_sampling: false
  raw_image: true

  # Action
  actions: true
  joints: true
  use_6d_rotation: ${data.train.use_6d_rotation}
  use_relative_action: ${data.train.use_relative_action}
  skip_no_action: true

  # Static frame removal
  remove_static_frames: ${data.train.remove_static_frames}
  static_rot_threshold: ${data.train.static_rot_threshold}
  static_trans_threshold: ${data.train.static_trans_threshold}
  static_gripper_threshold: ${data.train.static_gripper_threshold}

  use_indicator_prompt: false
  use_indicator_positive: false

  num_view_probs: ${data.train.num_view_probs}
  cam_mapping_dir: ${data.train.cam_mapping_dir}
  joint_action_mapping_dir: ${data.train.joint_action_mapping_dir}

  dataset_image_size: ${data.train.dataset_image_size}
  # Val: match train drop probs for consistent eval
  task_video_drop_prob: ${data.train.task_video_drop_prob}
  task_text_drop_prob: ${data.train.task_text_drop_prob}

  # No augmentation for val
  use_augmentation: false
  datasets_weight: false

  processor:
    action_output_dim: ${data.train.processor.action_output_dim}
    proprio_output_dim: ${data.train.processor.proprio_output_dim}

  action_video_freq_ratio: ${data.train.action_video_freq_ratio}
  max_action_len: ${data.train.max_action_len}
  context_len: ${data.train.context_len}
  dataset_fps: ${data.train.dataset_fps}
  task_max_frames: ${data.train.task_max_frames}
  task_paths_filename: ${data.train.task_paths_filename}
  sampling_interval_min_mult: ${data.train.sampling_interval_min_mult}
  sampling_interval_max_mult: ${data.train.sampling_interval_max_mult}
  task_video_random_offset: ${data.train.task_video_random_offset}

extra_val:
  seen:
    _target_: self_grounded_prediction.datasets.custom.mydatasets.build_custom_dataset

    # Same data as training — evaluates "seen" (in-distribution) performance
    data_path: ${data.train.data_path}
    exclude_episode_json: ${data.train.exclude_episode_json}

    # Val settings: deterministic, no augmentation
    frames: ${data.train.frames}
    action_frames: ${data.train.action_frames}
    random_frame_sampling: false
    raw_image: true

    actions: true
    joints: true
    use_6d_rotation: ${data.train.use_6d_rotation}
    use_relative_action: ${data.train.use_relative_action}
    skip_no_action: true

    remove_static_frames: ${data.train.remove_static_frames}
    static_rot_threshold: ${data.train.static_rot_threshold}
    static_trans_threshold: ${data.train.static_trans_threshold}
    static_gripper_threshold: ${data.train.static_gripper_threshold}

    use_indicator_prompt: false
    use_indicator_positive: false

    num_view_probs: ${data.train.num_view_probs}
    cam_mapping_dir: ${data.train.cam_mapping_dir}
    joint_action_mapping_dir: ${data.train.joint_action_mapping_dir}

    dataset_image_size: ${data.train.dataset_image_size}
    task_video_drop_prob: ${data.train.task_video_drop_prob}
    task_text_drop_prob: ${data.train.task_text_drop_prob}

    use_augmentation: false
    datasets_weight: false

    processor:
      action_output_dim: ${data.train.processor.action_output_dim}
      proprio_output_dim: ${data.train.processor.proprio_output_dim}

    action_video_freq_ratio: ${data.train.action_video_freq_ratio}
    max_action_len: ${data.train.max_action_len}
    context_len: ${data.train.context_len}
    dataset_fps: ${data.train.dataset_fps}
    task_max_frames: ${data.train.task_max_frames}
    task_paths_filename: ${data.train.task_paths_filename}
    sampling_interval_min_mult: ${data.train.sampling_interval_min_mult}
    sampling_interval_max_mult: ${data.train.sampling_interval_max_mult}
    task_video_random_offset: ${data.train.task_video_random_offset}

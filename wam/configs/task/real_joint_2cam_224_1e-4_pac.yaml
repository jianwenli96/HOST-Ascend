# @package _global_

defaults:
  - override /data: custom_cross_all
  - override /model: fastwam_joint_cross_attn
  - _self_

# dataloading
batch_size: 2
num_workers: 10

model:
  mot_checkpoint_mixed_attn: false
  task_video_conditioning_mode: "prepend_cross_attn"
  video_dit_config:
    attn_gate_mode: "none"
    task_video_cross_attn_gate_mode: "none"
  action_dit_config:
    attn_gate_mode: "none"
    task_video_cross_attn_gate_mode: "none"

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1e-5
num_epochs: 9999
max_steps: 8000
log_every: 10
save_every: 8000
eval_every: 1000

# training
gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null

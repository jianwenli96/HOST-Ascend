# @package _global_

defaults:
  - override /data: custom_text_master
  - override /model: self_grounded_predictor_joint
  - _self_

# dataloading
batch_size: 2
num_workers: 10

model:
  mot_checkpoint_mixed_attn: false

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1e-5
num_epochs: 9999
max_steps: 30000
log_every: 10
save_every: 4000
eval_every: 1000

# training
gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null
